<!doctype html>
<html>
  <head>
    <!-- <base href="\/" /> -->
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="TrustPool: For corporate commuter" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#BDF103" />
    <meta name="apple-mobile-web-app-title" content="TrustPool: For corporate commuter" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>TrustPool</title>
    <link rel="manifest" href="manifest.json" />

    <!-- ✅ Highly Optimized, Minified Inlined CSS to Prevent Render Blocking -->
    <style>
      body{background-color:#BDF103;margin:0;padding:0;overflow:hidden}
      .startup-loading-container{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;width:100vw;position:fixed;top:0;left:0;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
      .spinner{width:40px;height:40px;border:4px solid rgba(0,0,0,0.08);border-top:4px solid #111827;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
      .loading-text{font-size:15px;color:#111827;font-weight:600;letter-spacing:-.01em}
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="loading-splash" class="startup-loading-container">
      <div class="spinner"></div>
      <div class="loading-text">Loading. please wait...</div>
    </div>

    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        window.__pwaInstallPrompt = e;
      });

      // ✅ High-Performance Cleanup Hook: Listens for the absolute earliest frame initialization signal
      window.addEventListener('flutter-first-frame', function() {
        var splash = document.getElementById('loading-splash');
        if (splash) { splash.remove(); }
      });
    </script>
    <!-- Keep async active to let your loading screen mount instantly without blockages -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
